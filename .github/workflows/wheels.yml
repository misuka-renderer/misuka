name: Build Python wheels
on:
  workflow_dispatch:
    inputs:
      upload_pypi:
        description: Upload wheels to PyPI
        type: boolean
        required: true
        default: false
      upload_testpypi:
        description: Upload wheels to TestPyPI
        type: boolean
        required: true
        default: false
      testpypi_build_tag:
        description: >
          TestPyPI build tag. Leave empty to continue from the highest tag
          already published for this version.
        type: string
        required: false
        default: ''

env:
  VARIANTS: "scalar_rgb,scalar_acoustic,cuda_ad_rgb,cuda_ad_acoustic,llvm_ad_rgb,llvm_ad_acoustic,metal_ad_rgb,metal_ad_acoustic"

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [windows-latest, macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        python: [cp39, cp310, cp311, cp312, cp312_stable, cp313, cp314]
      fail-fast: false

    name: >
      ${{ matrix.python }} wheel for ${{ matrix.os }}
      ${{ (endsWith(matrix.python, '_stable') && '(stable ABI)') || '' }}
    runs-on: ${{ matrix.os }}

    steps:
      ###########################################################
      # Setup local environment (source code, build requirements)
      ###########################################################
      - uses: Wandalen/wretry.action@v1.2.0
        with:
          action: actions/checkout@v3
          with: |
            submodules: recursive
          attempt_limit: 3
          attempt_delay: 2000

      - uses: actions/setup-python@v4
        name: Install Python
        with:
          python-version: '3.11'

      - name: Install LLVM 18.1.8 on Windows
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 18.1.8

      - name: Prepare compiler environment for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Required for libjpeg-turbo
      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.3.1


      ################################################################
      # Set up envvars to build the correct wheel (stable ABI or not)
      ################################################################
      - name: Prepare cibuildwheel environment (UNIX)
        if: ${{ ! endsWith(matrix.python, '_stable') && runner.os != 'Windows' }}
        run: |
          echo "CIBW_BUILD=${{ matrix.python }}-*" >> $GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args=-DMI_DEFAULT_VARIANTS=${{ env.VARIANTS }}" >> $GITHUB_ENV

      - name: Prepare cibuildwheel environment (Windows)
        if: ${{ ! endsWith(matrix.python, '_stable') && runner.os == 'Windows' }}
        run: |
          echo "CIBW_BUILD=${{ matrix.python }}-*" >> $env:GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args=-DMI_DEFAULT_VARIANTS=${{ env.VARIANTS }}" >> $env:GITHUB_ENV

      - name: Prepare cibuildwheel environment for stable ABI wheel (UNIX)
        if: ${{ endsWith(matrix.python, '_stable') && runner.os != 'Windows' }}
        run: |
          stable_cp=$(echo ${{ matrix.python }} | cut -d_ -f1)
          echo "CIBW_BUILD=${stable_cp}-*" >> $GITHUB_ENV
          echo "CIBW_ENVIRONMENT=SKBUILD_WHEEL_PY_API=cp312" >> $GITHUB_ENV
          echo "CIBW_BUILD_FRONTEND=pip; args: --no-build-isolation" >> $GITHUB_ENV
          echo "CIBW_BEFORE_BUILD=python {project}/.github/install_build_deps_abi3.py" >> $GITHUB_ENV
          echo "CIBW_BEFORE_TEST=python {project}/.github/install_build_deps_abi3.py --drjit-only" >> $GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args=-DDRJIT_STABLE_ABI=ON;-DMI_STABLE_ABI=ON;-DMI_DEFAULT_VARIANTS=${{ env.VARIANTS }}" >> $GITHUB_ENV

      - name: Prepare cibuildwheel environment for stable ABI wheel (Windows)
        if: ${{ endsWith(matrix.python, '_stable') && runner.os == 'Windows' }}
        run: |
          $stable_cp = '${{ matrix.python }}' -split '_'
          echo "CIBW_BUILD=$($stable_cp[0])-*" >> $env:GITHUB_ENV
          echo "CIBW_ENVIRONMENT=SKBUILD_WHEEL_PY_API=cp312" >> $env:GITHUB_ENV
          echo "CIBW_BUILD_FRONTEND=pip; args: --no-build-isolation" >> $env:GITHUB_ENV
          echo "CIBW_BEFORE_BUILD=python {project}/.github/install_build_deps_abi3.py" >> $env:GITHUB_ENV
          echo "CIBW_BEFORE_TEST=python {project}/.github/install_build_deps_abi3.py --drjit-only" >> $env:GITHUB_ENV
          echo "CIBW_CONFIG_SETTINGS=cmake.args=-DDRJIT_STABLE_ABI=ON;-DMI_STABLE_ABI=ON;-DMI_DEFAULT_VARIANTS=${{ env.VARIANTS }}" >> $env:GITHUB_ENV


      #########################
      # Build and store wheels
      #########################
      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  upload_testpypi:
    name: Upload wheels to TestPyPI
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload_testpypi == 'true' }}
    needs: [build_wheels]
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout must come first. It cleans the workspace, so running it after
      # the download would wipe dist/.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repack tooling
        run: python -m pip install 'wheel>=0.40'

      #####################################################################
      # An index never lets a filename be reused, so uploading the same
      # version twice needs new filenames. A wheel build tag supplies them
      # without changing the version, and pip treats the highest tag as the
      # newest wheel. This is a TestPyPI convenience only: PyPI publishes
      # the pristine artifacts below.
      #####################################################################
      - name: Pick the build tag
        id: build_tag
        env:
          BUILD_TAG_OVERRIDE: ${{ github.event.inputs.testpypi_build_tag }}
        run: python .github/next_build_tag.py dist >> "$GITHUB_OUTPUT"

      - name: Re-tag wheels
        env:
          BUILD_TAG: ${{ steps.build_tag.outputs.build_tag }}
        run: |
          mkdir -p retagged
          for whl in dist/*.whl; do
              rm -rf unpacked && mkdir unpacked
              python -m wheel unpack -d unpacked "$whl"
              python -m wheel pack --build-number "$BUILD_TAG" -d retagged unpacked/*/
          done

          built=$(ls -1 dist/*.whl | wc -l)
          tagged=$(ls -1 retagged/*.whl | wc -l)
          if [ "$built" != "$tagged" ]; then
              echo "::error::re-tagged $tagged of $built wheels"
              exit 1
          fi
          ls -1 retagged

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{secrets.TESTPYPI_TOKEN}}
          packages-dir: retagged

  upload_pypi:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload_pypi == 'true' }}
    needs: [build_wheels]
    environment: pypi-release
    permissions:
      contents: read
      id-token: write

    steps:
      #########################
      # Fetch and upload wheels
      #########################
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
