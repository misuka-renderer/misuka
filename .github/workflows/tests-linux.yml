name: build Linux

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    if: false  # temporary: this experiment PR only exercises the Windows leg
    uses: ./.github/workflows/test-build.yml
    with:
      os: ubuntu-24.04
