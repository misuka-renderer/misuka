name: Compile and test (reusable)

on:
  workflow_call:
    inputs:
      os:
        description: Runner image to build and test on
        type: string
        required: true

env:
  VARIANTS: "scalar_rgb,scalar_acoustic,llvm_ad_rgb,llvm_ad_acoustic"

jobs:
  build_and_test:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180

    steps:
      - uses: Wandalen/wretry.action@v1.2.0
        with:
          action: actions/checkout@v3
          with: |
            submodules: recursive
          attempt_limit: 3
          attempt_delay: 2000

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.12'

      ###########################################################
      # Platform specific build dependencies
      ###########################################################
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm libllvm18

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja nasm llvm

      - name: Install LLVM 18.1.8 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 18.1.8

      - name: Prepare compiler environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
          echo "DRJIT_LIBLLVM_PATH=$env:LLVM_PATH\bin\LLVM-C.dll" >> $env:GITHUB_ENV

      ###########################################################
      # Configure and build
      ###########################################################
      - name: Configure
        run: |
          cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release -DMI_DEFAULT_VARIANTS="${{ env.VARIANTS }}"

      - name: Build
        run: |
          cmake --build build

      ###########################################################
      # Run the test suite
      ###########################################################
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8" pytest-xdist numpy

      - name: Run tests (UNIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source build/setpath.sh
          pytest src -m "not slow" -n auto

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\setpath.ps1
          pytest src -m "not slow" -n auto
